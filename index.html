
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website đầu tiên của tôi</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f0f4ff;
      padding: 70px 20px;
    }
    .card {
      max-width: 600px;
      margin: auto;
      padding: 35px 20px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px #0001;
    }
    h1 { color: #2457c5; }
    p { color: #444; line-height: 1.7; }
    a {
      display: inline-block;
      padding: 12px 20px;
      background: #2457c5;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Xin chào! 👋</h1>
    <p>Chào mừng bạn đến với website đầu tiên của tôi.</p>
    <p>Website này được xuất bản bằng GitHub Pages.</p>
    <a href="https://github.com/">Khám phá GitHub</a>
  </div>
</body>
</html>
