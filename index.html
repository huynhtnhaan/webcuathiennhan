
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Huynh TNhaan | Vintage Page</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: #3d2418;
      font-family: "DM Sans", sans-serif;
      background-color: #ead8b9;
      background-image:
        radial-gradient(ellipse at 20% 20%, #f6e9d0 0%, transparent 55%),
        radial-gradient(ellipse at 80% 80%, #c6a47a 0%, transparent 60%);
      min-height: 100vh;
    }

    header {
      min-height: 76px;
      padding: 18px 7%;
      background: #382116;
      color: #ead0a5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      border-bottom: 2px solid #a57b49;
    }

    .logo {
      font-family: "Playfair Display", serif;
      font-size: 25px;
      letter-spacing: 1px;
    }

    nav {
      display: flex;
      gap: 24px;
    }

    nav a {
      color: #ead0a5;
      text-decoration: none;
      font-size: 14px;
    }

    nav a:hover {
      color: white;
    }

    .hero {
      min-height: 78vh;
      padding: 55px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .paper {
      width: min(850px, 100%);
      padding: 65px 35px;
      position: relative;
      background: rgba(248, 235, 210, 0.88);
      border: 1px solid #ad8656;
      outline: 1px solid rgba(122, 78, 42, 0.3);
      outline-offset: -9px;
      box-shadow: 0 18px 50px rgba(64, 38, 20, 0.15);
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #89633b;
    }

    h1 {
      margin: 25px 0 18px;
      font-family: "Playfair Display", serif;
      font-size: clamp(48px, 9vw, 88px);
      font-weight: 500;
      font-style: italic;
    }

    .intro {
      max-width: 650px;
      margin: 0 auto;
      font-family: "Playfair Display", serif;
      font-size: clamp(23px, 4vw, 34px);
      line-height: 1.5;
    }

    .description {
      max-width: 480px;
      margin: 22px auto 32px;
      color: #74563e;
      line-height: 1.9;
      font-size: 15px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      padding: 16px 36px;
      border: 1px solid #d8b77f;
      outline: 1px solid #5a321e;
      outline-offset: 4px;
      background: #4a2b1b;
      color: #f6e4c2;
      text-decoration: none;
      font-family: "Playfair Display", serif;
      font-size: 18px;
      transition: 0.25s ease;
    }

    .button:hover {
      background: #744b2d;
      transform: translateY(-3px);
    }

    .footer {
      padding: 10px 20px 32px;
      text-align: center;
      color: #79583b;
      font-size: 11px;
      letter-spacing: 3px;
    }

    .ornament {
      margin-bottom: 20px;
      color: #a27a4b;
      font-size: 24px;
    }

    @media (max-width: 560px) {
      header {
        padding: 18px;
        flex-direction: column;
      }

      nav {
        gap: 18px;
      }

      .paper {
        padding: 50px 22px;
      }

      .intro {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">Huynh TNhaan</div>

    <nav>
      <a href="index.html">Trang chủ</a>
      <a href="next.html">Khám phá</a>
    </nav>
  </header>

  <main class="hero">
    <section class="paper">
      <div class="ornament">✦ ─── ✦ ─── ✦</div>

      <div class="eyebrow">A little place of my own</div>

      <h1>Xin chào!</h1>

      <p class="intro">
        Chào mừng bạn đến với page do
        <strong>Huynh TNhaan</strong> tạo ra.
      </p>

      <p class="description">
        Một góc nhỏ mang màu sắc hoài cổ,
        lưu giữ những điều mình yêu thích.
        Cảm ơn bạn đã ghé thăm.
      </p>

      <a class="button" href="next.html">
        BẮT ĐẦU <span>→</span>
      </a>
    </section>
  </main>

  <footer class="footer">
    KHÁM PHÁ &nbsp; · &nbsp; HỌC HỎI &nbsp; · &nbsp; PHÁT TRIỂN
  </footer>
</body>
</html>
